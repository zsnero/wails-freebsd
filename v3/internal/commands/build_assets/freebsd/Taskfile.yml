version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Docker image for cross-compilation. Not used on FreeBSD: cgo cannot be
  # cross-compiled to FreeBSD from a Linux host, because the build needs a
  # FreeBSD sysroot plus webkit2-gtk built for the target. FreeBSD builds are
  # always native.
  CROSS_IMAGE: wails-cross

tasks:
  build:
    summary: Builds the application for FreeBSD
    desc: |
      FreeBSD requires CGO and can only be built natively, so this always runs
      the native build. To target FreeBSD from another OS, use a FreeBSD host
      (or a VM) and run the same task there.

      Dependencies: sudo pkg install webkit2-gtk_41 gtk3 pkgconf
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on FreeBSD
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: 'pkg-config --exists webkit2gtk-4.1'
        msg: "webkit2gtk-4.1 not found. Install it with: sudo pkg install webkit2-gtk_41"
      - sh: 'pkg-config --exists gtk+-3.0'
        msg: "GTK3 not found. Install it with: sudo pkg install gtk3"
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o {{.OUTPUT}}'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: freebsd
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Packaging is not yet supported on FreeBSD
    desc: |
      Wails' packaging backend is nfpm, which produces deb/rpm/apk/ipk/arch
      packages. FreeBSD's native formats are ports (+pkg) and packages, neither
      of which nfpm emits.

      Until that lands, install the built binary directly and register it with
      the desktop environment using the generated .desktop file:

        task freebsd:generate:dotdesktop
        sudo install -m 0755 bin/{{.APP_NAME}} /usr/local/bin/
        sudo install -d ~/.local/share/applications
        install -m 0644 build/freebsd/{{.APP_NAME}}.desktop ~/.local/share/applications/
    cmds:
      - echo "FreeBSD packaging is not supported yet. See 'task freebsd:package' for manual install instructions."
      - exit 1

  generate:dotdesktop:
    summary: Generates a `.desktop` file for the FreeBSD desktop menu
    dir: build
    cmds:
      - mkdir -p {{.ROOT_DIR}}/build/freebsd
      - wails3 generate .desktop -name "{{.APP_NAME}}" -exec "{{.EXEC}}" -icon "{{.ICON}}" -outputfile "{{.OUTPUTFILE}}" -categories "{{.CATEGORIES}}"
    vars:
      APP_NAME: '{{.APP_NAME}}'
      # Point Exec at the installed location, since a .desktop file is only
      # useful from the desktop menu where the relative build path is wrong.
      EXEC: '/usr/local/bin/{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}'
      CATEGORIES: 'Development;'
      OUTPUTFILE: '{{.ROOT_DIR}}/build/freebsd/{{.APP_NAME}}.desktop'

  run:
    summary: Runs the application
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
